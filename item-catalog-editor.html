<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>PathFriends Item Catalog Editor</title>
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css"
      rel="stylesheet"
    />
    <link href="css/item-catalog-editor.css?v=trait-requirements-1" rel="stylesheet" />
    <link href="css/admin-review-marker.css?v=1" rel="stylesheet" />
    <link href="css/effect-editor.css?v=damage-denominator-1" rel="stylesheet" />
    <link href="css/effect-rolls.css?v=healing-layout-1" rel="stylesheet" />
    <link href="modals/generated-equipment-picker.css?v=effect-labels-white-1" rel="stylesheet" />
    <link href="modals/magic-search.css" rel="stylesheet" />
    <link href="modals/custom-skill-list.css?v=custom-target-lists-1" rel="stylesheet" />
    <link href="css/modal-rules.css?v=mobile-workspace-1" rel="stylesheet" />
  </head>
  <body>
    <div id="appNavbar"></div>

    <main class="container-fluid mt-3">
      <div
        class="d-flex justify-content-between align-items-start gap-2 flex-wrap mb-3"
      >
        <div>
          <h3 class="mb-0">PathFriends Item Catalog Editor</h3>
          <div class="small-text">
            Local static-data editor for
            <code>data/weapons.json</code>, <code>data/armor-shields.json</code>,
            <code>data/mundane-items.json</code>, <code>data/wondrous.json</code>.
            Add new items or edit every field on an existing one, plus
            Effects/DR/SR/Class Skills exactly like class features.
          </div>
        </div>
        <div class="d-flex gap-2 flex-wrap justify-content-end">
          <button
            id="openProjectFolderBtn"
            class="btn btn-outline-info btn-sm"
            type="button"
          >
            <i class="bi bi-folder2-open"></i> Open Project Folder
          </button>
          <button
            id="saveCatalogBtn"
            class="btn btn-primary btn-sm"
            type="button"
          >
            <i class="bi bi-save"></i> Save to Project
          </button>
          <button id="refreshRulesCacheBtn" class="btn btn-outline-warning btn-sm" type="button">
            <i class="bi bi-arrow-clockwise"></i> Refresh Rules Data
          </button>
        </div>
      </div>

      <div id="itemEditorStatus" class="alert d-none py-2"></div>

      <div class="editor-shell">
        <aside class="panel">
          <div class="catalog-tabs" id="catalogTabs" role="tablist"></div>
          <div class="d-flex justify-content-between align-items-end gap-2 mb-2">
            <div class="flex-grow-1">
              <label for="itemSearch">Search Items</label>
              <input
                id="itemSearch"
                class="form-control form-control-sm"
                placeholder="Item name or requirement"
              />
            </div>
            <button
              id="addItemBtn"
              class="btn btn-outline-info btn-sm"
              type="button"
            >
              <i class="bi bi-plus-lg"></i> Add Item
            </button>
          </div>
          <button id="itemDecisionFilter" class="btn btn-outline-info btn-sm w-100 mb-2" type="button" aria-pressed="false">
            <i class="bi bi-ui-checks"></i> Decisions
          </button>
          <button id="itemAuraFilter" class="btn btn-outline-info btn-sm w-100 mb-2" type="button" aria-pressed="false">
            <i class="bi bi-bullseye"></i> Auras
          </button>
          <button id="itemSummonFilter" class="btn btn-outline-info btn-sm w-100 mb-2" type="button" aria-pressed="false">
            <i class="bi bi-people"></i> Summons
          </button>
          <div id="itemCount" class="small-text mb-2"></div>
          <div id="itemList" class="item-list"></div>
        </aside>

        <section id="itemEditorPanel" class="panel">
          <div class="small-text">Choose an item to edit.</div>
        </section>
      </div>
    </main>

    <script src="scripts/admin-review-marker.js?v=1"></script>
    <script src="scripts/catalog-cache.js?v=2"></script>
    <script src="scripts/navbar.js?v=responsive-navbar-1"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="scripts/supabase-config.js"></script>
    <script src="scripts/app-supabase.js?v=weapon-extra-damage-1"></script>
    <script src="scripts/effect-mechanics.js?v=aura-volumes-1"></script>
    <script src="scripts/item-data.js?v=1"></script>
    <script src="modals/effect-duration-editor.js?v=nested-scale-1"></script>
    <script src="scripts/effect-stat-options.js?v=weapon-damage-size-1"></script>
    <script src="modals/effect-choice-picker.js?v=named-skill-choice-1"></script>
    <script src="scripts/spell-data.js?v=spells-json-1"></script>
    <script src="modals/magic-search.js?v=sla-spell-list-1"></script>
    <script src="modals/custom-skill-list.js?v=skill-list-options-1"></script>
    <script src="scripts/condition-config.js?v=ability-groups-1"></script>
    <script src="scripts/effect-rolls.js?v=damage-denominator-1"></script>
    <script src="scripts/effect-periodic.js?v=recurring-saves-1"></script>
    <script src="scripts/effect-decisions.js?v=owner-1"></script>
    <script src="scripts/effect-saves.js?v=recurring-saves-1"></script>
    <script src="scripts/natural-weapons.js?v=3"></script>
    <script src="scripts/template-data.js?v=1"></script>
    <script src="scripts/summon-creatures.js?v=creature-templates-1"></script>
    <script src="scripts/texture-catalog.js?v=3"></script>
    <script src="scripts/effect-editor.js?v=periodic-turns-1"></script>
    <script src="modals/generated-equipment-picker.js?v=natural-weapons-1"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="scripts/weapon-damage-components.js?v=2"></script>
    <script src="scripts/pages/item-catalog-editor.js?v=summon-filter-1"></script>
    <script src="scripts/modal-rules.js?v=mobile-compact-1"></script>
  </body>
</html>
