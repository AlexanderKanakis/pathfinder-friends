<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>PathFriends Characters</title>
    <meta name="viewport" content="width=device-width, initial-scale=1" />

    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css"
      rel="stylesheet"
    />

    <link href="css/characters.css" rel="stylesheet" />
  </head>
  <body>
    <div id="appNavbar"></div>

    <main class="container character-shell mt-4">
      <div class="d-flex justify-content-between align-items-center gap-2 mb-3">
        <div>
          <h3 class="mb-0">Characters</h3>
          <div id="characterContextLabel" class="small text-secondary"></div>
        </div>
        <button
          class="btn btn-primary btn-sm"
          type="button"
          data-bs-toggle="modal"
          data-bs-target="#newCharacterModal"
        >
          <i class="bi bi-plus-lg"></i> Add Character
        </button>
      </div>

      <input
        id="characterSearch"
        class="form-control form-control-sm mb-3"
        placeholder="Character Name"
      />

      <div id="characterStatus" class="alert d-none py-2"></div>
      <div id="characterList" class="character-grid"></div>
    </main>

    <div
      class="modal fade"
      id="newCharacterModal"
      tabindex="-1"
      aria-labelledby="newCharacterModalLabel"
      aria-hidden="true"
    >
      <div class="modal-dialog modal-dialog-centered">
        <form
          id="newCharacterForm"
          class="modal-content bg-dark text-white border-secondary"
        >
          <div class="modal-header border-secondary">
            <h5 class="modal-title" id="newCharacterModalLabel">
              Add Character
            </h5>
            <button
              type="button"
              class="btn-close btn-close-white d-none"
              data-bs-dismiss="modal"
              aria-label="Close"
            ></button>
          </div>
          <div class="modal-body">
            <div class="mb-2">
              <label for="newCharacterName">Character Name</label>
              <input
                id="newCharacterName"
                class="form-control form-control-sm"
                required
                maxlength="120"
              />
            </div>
            <div>
              <label for="newCharacterClass">Starting Class</label>
              <select
                id="newCharacterClass"
                class="form-select form-select-sm"
                required
              ></select>
            </div>
          </div>
          <div class="modal-footer border-secondary">
            <span
              id="newCharacterStatus"
              class="small text-secondary me-auto"
            ></span>
            <button
              type="button"
              class="btn btn-outline-light btn-sm"
              data-bs-dismiss="modal"
            >
              Cancel
            </button>
            <button
              id="createCharacterButton"
              class="btn btn-primary btn-sm"
              type="submit"
            >
              Create
            </button>
          </div>
        </form>
      </div>
    </div>

    <div
      class="modal fade"
      id="deleteCharacterModal"
      tabindex="-1"
      aria-labelledby="deleteCharacterModalLabel"
      aria-hidden="true"
    >
      <div class="modal-dialog modal-dialog-centered">
        <form
          id="deleteCharacterForm"
          class="modal-content bg-dark text-white border-secondary"
        >
          <div class="modal-header border-secondary">
            <h5 class="modal-title" id="deleteCharacterModalLabel">
              Delete Character
            </h5>
            <button
              type="button"
              class="btn-close btn-close-white d-none"
              data-bs-dismiss="modal"
              aria-label="Close"
            ></button>
          </div>
          <div class="modal-body">
            <p class="mb-1">
              Delete <strong id="deleteCharacterName"></strong>?
            </p>
            <div class="small text-secondary">
              This removes the character sheet and unassigns any loot tied to
              it.
            </div>
          </div>
          <div class="modal-footer border-secondary">
            <span
              id="deleteCharacterStatus"
              class="small text-secondary me-auto"
            ></span>
            <button
              type="button"
              class="btn btn-outline-light btn-sm"
              data-bs-dismiss="modal"
            >
              Cancel
            </button>
            <button
              id="confirmDeleteCharacterBtn"
              class="btn btn-danger btn-sm"
              type="submit"
            >
              <i class="bi bi-trash"></i> Delete
            </button>
          </div>
        </form>
      </div>
    </div>

    <script src="scripts/navbar.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="scripts/supabase-config.js"></script>
    <script src="scripts/app-supabase.js"></script>
    <script src="scripts/class-data.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="scripts/pages/characters.js"></script>
  </body>
</html>
