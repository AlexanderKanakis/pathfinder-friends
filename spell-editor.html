<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>PathFriends Spell Editor</title>
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta
      http-equiv="Cache-Control"
      content="no-cache, no-store, must-revalidate"
    />
    <meta http-equiv="Pragma" content="no-cache" />
    <meta http-equiv="Expires" content="0" />
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css"
      rel="stylesheet"
    />
    <link href="css/spell-editor.css?v=2" rel="stylesheet" />
    <link href="css/effect-editor.css?v=bonus-ranks-1" rel="stylesheet" />
    <link
      href="modals/generated-equipment-picker.css?v=effect-labels-white-1"
      rel="stylesheet"
    />
    <link href="modals/magic-search.css" rel="stylesheet" />
    <link href="modals/custom-skill-list.css?v=custom-target-lists-1" rel="stylesheet" />
  </head>
  <body>
    <div id="appNavbar"></div>

    <main class="container-fluid mt-3">
      <div
        class="d-flex justify-content-between align-items-start gap-2 flex-wrap mb-3"
      >
        <div>
          <h3 class="mb-0">PathFriends Spell Editor</h3>
          <div class="small-text">
            Local static-data editor for <code>data/spells.json</code>.
            Add and correct spell effects here.
          </div>
        </div>
        <div class="d-flex gap-2 flex-wrap justify-content-end">
          <button
            id="openProjectFolderBtn"
            class="btn btn-outline-info btn-sm"
            type="button"
          >
            <i class="bi bi-folder2-open"></i> Open Project Folder
          </button>
          <button
            id="exportSelectedSpellBtn"
            class="btn btn-outline-light btn-sm"
            type="button"
          >
            <i class="bi bi-filetype-json"></i> Export Selected Spell
          </button>
          <button id="saveSpellsFileBtn" class="btn btn-primary btn-sm" type="button">
            <i class="bi bi-save"></i> Save to Project
          </button>
        </div>
      </div>

      <div id="spellEditorStatus" class="alert d-none py-2"></div>

      <div class="editor-shell">
        <aside class="panel">
          <label for="spellSearch">Search Spells</label>
          <input
            id="spellSearch"
            class="form-control form-control-sm mb-2"
            placeholder="Spell name, descriptor, class, text"
          />
          <div class="spell-filter-grid mb-2">
            <div>
              <label for="spellSchoolFilter">School</label>
              <select id="spellSchoolFilter" class="form-select form-select-sm"></select>
            </div>
            <div>
              <label for="spellLevelFilter">Level</label>
              <select id="spellLevelFilter" class="form-select form-select-sm"></select>
            </div>
          </div>
          <div id="spellCount" class="small-text mb-2"></div>
          <div id="spellList" class="spell-list"></div>
        </aside>

        <section id="spellEditorPanel" class="panel">
          <div class="small-text">Choose a spell to edit.</div>
        </section>
      </div>
    </main>

    <script src="scripts/navbar.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="scripts/supabase-config.js"></script>
    <script src="scripts/app-supabase.js?v=bonus-ranks-1"></script>
    <script src="scripts/effect-mechanics.js?v=bonus-ranks-1"></script>
    <script src="modals/effect-duration-editor.js?v=duration-editor-reuse-1"></script>
    <script src="scripts/effect-stat-options.js?v=improvised-1"></script>
    <script src="modals/effect-choice-picker.js?v=named-skill-choice-1"></script>
    <script src="scripts/spell-data.js?v=spells-json-1"></script>
    <script src="modals/magic-search.js?v=sla-spell-list-1"></script>
    <script src="modals/custom-skill-list.js?v=skill-list-options-1"></script>
    <script src="scripts/effect-editor.js?v=improvised-1"></script>
    <script src="modals/generated-equipment-picker.js?v=effect-labels-white-1"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="scripts/pages/spell-editor.js?v=bonus-ranks-1"></script>
  </body>
</html>
