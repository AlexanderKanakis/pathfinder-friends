<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>PathFriends Item Catalog Editor</title>
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css"
      rel="stylesheet"
    />
    <link href="css/item-catalog-editor.css?v=trait-requirements-1" rel="stylesheet" />
    <link href="css/effect-editor.css?v=spell-cl-dc-extras-1" rel="stylesheet" />
    <link href="modals/generated-equipment-picker.css?v=effect-labels-white-1" rel="stylesheet" />
    <link href="modals/magic-search.css" rel="stylesheet" />
    <link href="modals/custom-skill-list.css?v=custom-target-lists-1" rel="stylesheet" />
  </head>
  <body>
    <div id="appNavbar"></div>

    <main class="container-fluid mt-3">
      <div
        class="d-flex justify-content-between align-items-start gap-2 flex-wrap mb-3"
      >
        <div>
          <h3 class="mb-0">PathFriends Item Catalog Editor</h3>
          <div class="small-text">
            Local static-data editor for
            <code>data/weapons.json</code>, <code>data/armor-shields.json</code>,
            <code>data/mundane-items.json</code>, <code>data/wondrous.json</code>.
            Add new items or edit every field on an existing one, plus
            Effects/DR/SR/Class Skills exactly like class features.
          </div>
        </div>
        <div class="d-flex gap-2 flex-wrap justify-content-end">
          <button
            id="openProjectFolderBtn"
            class="btn btn-outline-info btn-sm"
            type="button"
          >
            <i class="bi bi-folder2-open"></i> Open Project Folder
          </button>
          <button
            id="saveCatalogBtn"
            class="btn btn-primary btn-sm"
            type="button"
          >
            <i class="bi bi-save"></i> Save to Project
          </button>
        </div>
      </div>

      <div id="itemEditorStatus" class="alert d-none py-2"></div>

      <div class="editor-shell">
        <aside class="panel">
          <div class="catalog-tabs" id="catalogTabs" role="tablist"></div>
          <div class="d-flex justify-content-between align-items-end gap-2 mb-2">
            <div class="flex-grow-1">
              <label for="itemSearch">Search Items</label>
              <input
                id="itemSearch"
                class="form-control form-control-sm"
                placeholder="Item name"
              />
            </div>
            <button
              id="addItemBtn"
              class="btn btn-outline-info btn-sm"
              type="button"
            >
              <i class="bi bi-plus-lg"></i> Add Item
            </button>
          </div>
          <div id="itemCount" class="small-text mb-2"></div>
          <div id="itemList" class="item-list"></div>
        </aside>

        <section id="itemEditorPanel" class="panel">
          <div class="small-text">Choose an item to edit.</div>
        </section>
      </div>
    </main>

    <script src="scripts/navbar.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="scripts/supabase-config.js"></script>
    <script src="scripts/app-supabase.js"></script>
    <script src="scripts/item-data.js?v=1"></script>
    <script src="modals/effect-duration-editor.js?v=favored-enemy-scale-1"></script>
    <script src="scripts/effect-stat-options.js?v=favored-enemy-increase-1"></script>
    <script src="modals/effect-choice-picker.js?v=named-skill-choice-1"></script>
    <script src="scripts/spell-data.js?v=spells-json-1"></script>
    <script src="modals/magic-search.js?v=sla-spell-list-1"></script>
    <script src="modals/custom-skill-list.js?v=custom-target-lists-1"></script>
    <script src="scripts/effect-editor.js?v=spell-cl-dc-extras-1"></script>
    <script src="modals/generated-equipment-picker.js?v=effect-labels-white-1"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="scripts/pages/item-catalog-editor.js?v=conditional-vars-1"></script>
  </body>
</html>
