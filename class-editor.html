<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>PathFriends Class Editor</title>
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css"
      rel="stylesheet"
    />
    <link href="css/class-editor.css?v=trait-requirements-1" rel="stylesheet" />
    <link href="css/admin-review-marker.css?v=1" rel="stylesheet" />
    <link href="css/effect-editor.css?v=attack-count-max-1" rel="stylesheet" />
    <link href="css/effect-rolls.css?v=healing-layout-1" rel="stylesheet" />
    <link href="modals/generated-equipment-picker.css?v=effect-labels-white-1" rel="stylesheet" />
    <link href="modals/magic-search.css" rel="stylesheet" />
    <link href="modals/custom-skill-list.css?v=custom-target-lists-1" rel="stylesheet" />
    <link href="css/modal-rules.css?v=mobile-workspace-1" rel="stylesheet" />
  </head>
  <body>
    <div id="appNavbar"></div>

    <main class="container-fluid mt-3">
      <div
        class="d-flex justify-content-between align-items-start gap-2 flex-wrap mb-3"
      >
        <div>
          <h3 class="mb-0">PathFriends Class Editor</h3>
          <div class="small-text">
            Local static-data editor for <code>data/classes/*.json</code>.
          </div>
        </div>
        <div class="d-flex gap-2 flex-wrap justify-content-end">
          <button
            id="openProjectFolderBtn"
            class="btn btn-outline-info btn-sm"
            type="button"
          >
            <i class="bi bi-folder2-open"></i> Open Project Folder
          </button>
          <button
            id="exportSelectedClassBtn"
            class="btn btn-outline-light btn-sm"
            type="button"
            title="Download just the selected class as its own file, matching the format of the files in data/classes/"
          >
            <i class="bi bi-filetype-json"></i> Export Selected Class
          </button>
          <button
            id="saveClassesFileBtn"
            class="btn btn-primary btn-sm"
            type="button"
          >
            <i class="bi bi-save"></i> Save to Project
          </button>
          <button id="refreshRulesCacheBtn" class="btn btn-outline-warning btn-sm" type="button">
            <i class="bi bi-arrow-clockwise"></i> Refresh Rules Data
          </button>
        </div>
      </div>

      <div id="classEditorStatus" class="alert d-none py-2"></div>

      <div class="editor-shell">
        <aside class="panel">
          <label for="classSearch">Search Classes</label>
          <input
            id="classSearch"
            class="form-control form-control-sm mb-2"
            placeholder="Class name"
          />
          <button id="classDecisionFilter" class="btn btn-outline-info btn-sm w-100 mb-2" type="button" aria-pressed="false">
            <i class="bi bi-ui-checks"></i> Decisions
          </button>
          <button id="classAuraFilter" class="btn btn-outline-info btn-sm w-100 mb-2" type="button" aria-pressed="false">
            <i class="bi bi-bullseye"></i> Auras
          </button>
          <div id="classCount" class="small-text mb-2"></div>
          <div id="classList" class="class-list"></div>
        </aside>

        <section id="classEditorPanel" class="panel">
          <div class="small-text">Choose a class to edit.</div>
        </section>
      </div>
    </main>

    <script src="scripts/admin-review-marker.js?v=1"></script>
    <script src="scripts/catalog-cache.js?v=2"></script>
    <script src="scripts/navbar.js?v=responsive-navbar-1"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="scripts/supabase-config.js"></script>
    <script src="scripts/app-supabase.js?v=trained-skills-1"></script>
    <script src="scripts/effect-mechanics.js?v=independent-effects-1"></script>
    <script src="scripts/class-data.js?v=global-pool-catalogs-1"></script>
    <script src="modals/effect-duration-editor.js?v=duration-formula-1"></script>
    <script src="scripts/effect-stat-options.js?v=weapon-damage-size-1"></script>
    <script src="modals/effect-choice-picker.js?v=named-skill-choice-1"></script>
    <script src="scripts/spell-data.js?v=spells-json-1"></script>
    <script src="modals/magic-search.js?v=sla-spell-list-1"></script>
    <script src="modals/custom-skill-list.js?v=skill-list-options-1"></script>
    <script src="scripts/condition-config.js?v=ability-groups-1"></script>
    <script src="scripts/effect-rolls.js?v=duration-formula-1"></script>
    <script src="scripts/effect-decisions.js?v=owner-1"></script>
    <script src="scripts/effect-saves.js?v=independent-effects-1"></script>
    <script src="scripts/natural-weapons.js?v=3"></script>
    <script src="scripts/summon-creatures.js?v=1"></script>
    <script src="scripts/texture-catalog.js?v=2"></script>
    <script src="scripts/effect-editor.js?v=attack-count-max-1"></script>
    <script src="scripts/weapon-damage-components.js?v=2"></script>
    <script src="modals/generated-equipment-picker.js?v=natural-weapons-1"></script>
    <script src="modals/class-feature-editor.js?v=weapon-damage-size-1"></script>
    <script src="modals/class-feature-pool-picker.js?v=1"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="scripts/pages/class-editor.js?v=aura-filter-1"></script>
    <script src="scripts/modal-rules.js?v=mobile-compact-1"></script>
  </body>
</html>
