<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>PathFriends Campaigns</title>
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css"
      rel="stylesheet"
    />
    <link href="css/campaigns.css" rel="stylesheet" />
  </head>
  <body>
    <div id="appNavbar"></div>

    <main class="container-fluid mt-3">
      <div
        class="d-flex flex-wrap justify-content-between align-items-center gap-2 mb-3"
      >
        <div>
          <h3 class="mb-0">PathFriends Campaigns</h3>
          <div class="small-text">
            Create, join, and manage campaign membership.
          </div>
        </div>
        <button
          class="btn btn-primary btn-sm"
          type="button"
          data-bs-toggle="modal"
          data-bs-target="#createCampaignModal"
        >
          <i class="bi bi-plus-lg"></i> Create Campaign
        </button>
      </div>

      <div id="campaignStatus" class="alert d-none py-2"></div>

      <div class="row g-3">
        <div class="col-xl-4">
          <section class="panel mb-3">
            <h5>Join Campaign</h5>
            <label class="small-text" for="campaignIdInput">Campaign ID</label>
            <div class="input-group input-group-sm">
              <input
                id="campaignIdInput"
                class="form-control"
                placeholder="Paste campaign id"
              />
              <button
                class="btn btn-outline-info"
                type="button"
                onclick="findCampaignById()"
              >
                Find
              </button>
            </div>
            <div id="foundCampaign" class="mt-2"></div>
          </section>

          <section class="panel mb-3">
            <h5>My Campaigns</h5>
            <div id="campaignList" class="detail-list"></div>
          </section>

          <section class="panel">
            <h5>Requests</h5>
            <div id="requestList" class="detail-list"></div>
          </section>
        </div>

        <div class="col-xl-8">
          <section class="panel">
            <div id="campaignDetails" class="small-text">
              Select a campaign to see details.
            </div>
          </section>
        </div>
      </div>
    </main>

    <div
      class="modal fade"
      id="createCampaignModal"
      tabindex="-1"
      aria-labelledby="createCampaignModalLabel"
      aria-hidden="true"
    >
      <div class="modal-dialog modal-dialog-centered">
        <form id="createCampaignForm" class="modal-content">
          <div class="modal-header">
            <h5 class="modal-title" id="createCampaignModalLabel">
              Create Campaign
            </h5>
            <button
              type="button"
              class="btn-close d-none"
              data-bs-dismiss="modal"
              aria-label="Close"
            ></button>
          </div>
          <div class="modal-body">
            <div class="mb-2">
              <label for="campaignName">Name</label>
              <input
                id="campaignName"
                class="form-control form-control-sm"
                required
              />
            </div>
            <div>
              <label for="campaignDescription">Description</label>
              <textarea
                id="campaignDescription"
                class="form-control form-control-sm"
              ></textarea>
            </div>
          </div>
          <div class="modal-footer">
            <button
              type="button"
              class="btn btn-outline-light btn-sm"
              data-bs-dismiss="modal"
            >
              Cancel
            </button>
            <button type="submit" class="btn btn-primary btn-sm">Create</button>
          </div>
        </form>
      </div>
    </div>

    <div
      class="modal fade"
      id="editCampaignModal"
      tabindex="-1"
      aria-labelledby="editCampaignModalLabel"
      aria-hidden="true"
    >
      <div class="modal-dialog modal-dialog-centered">
        <form id="editCampaignForm" class="modal-content">
          <div class="modal-header">
            <h5 class="modal-title" id="editCampaignModalLabel">
              Edit Campaign
            </h5>
            <button
              type="button"
              class="btn-close d-none"
              data-bs-dismiss="modal"
              aria-label="Close"
            ></button>
          </div>
          <div class="modal-body">
            <input id="editCampaignId" type="hidden" />
            <div class="mb-2">
              <label for="editCampaignName">Name</label>
              <input
                id="editCampaignName"
                class="form-control form-control-sm"
                required
              />
            </div>
            <div>
              <label for="editCampaignDescription">Description</label>
              <textarea
                id="editCampaignDescription"
                class="form-control form-control-sm"
              ></textarea>
            </div>
          </div>
          <div class="modal-footer">
            <button
              type="button"
              class="btn btn-outline-light btn-sm"
              data-bs-dismiss="modal"
            >
              Cancel
            </button>
            <button type="submit" class="btn btn-primary btn-sm">Save</button>
          </div>
        </form>
      </div>
    </div>

    <div
      class="modal fade"
      id="campaignDetailsModal"
      tabindex="-1"
      aria-labelledby="campaignDetailsModalLabel"
      aria-hidden="true"
    >
      <div class="modal-dialog modal-lg modal-dialog-scrollable">
        <div class="modal-content">
          <div class="modal-header">
            <h5 class="modal-title" id="campaignDetailsModalLabel">Campaign</h5>
            <button
              type="button"
              class="btn-close"
              data-bs-dismiss="modal"
              aria-label="Close"
            ></button>
          </div>
          <div id="campaignDetailsModalBody" class="modal-body"></div>
        </div>
      </div>
    </div>

    <script src="scripts/navbar.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="scripts/supabase-config.js"></script>
    <script src="scripts/app-supabase.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="scripts/pages/campaigns.js"></script>
  </body>
</html>
