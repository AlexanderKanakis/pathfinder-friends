<!doctype html>
<html>
  <head>
    <meta http-equiv="Content-Type" content="text/html; charset=UTF-8" />
    <meta
      name="description"
      content="A free online calculator for using the Craft skill in Pathfinder RPG."
    />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <script type="module" src="scripts/main.js"></script>
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
      rel="stylesheet"
      integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH"
      crossorigin="anonymous"
    />
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css"
      rel="stylesheet"
    />
    <title>PathFriends Alchemical Crafting Calculator</title>
    <link href="css/craft-calculator.css" rel="stylesheet" />
  </head>
  <body>
    <div id="appNavbar"></div>

    <div class="w-100 my-3 px-4" style="text-align: left">
      <h3>Alchemical Crafting Calculator</h3>
    </div>

    <div class="search-shell mx-auto m-4">
      <label class="small" for="Search_Item" title="Search Item to craft"
        >Search Item</label
      >
      <input
        class="form-control form-control-sm"
        id="Search_Item"
        title="Search Item to craft"
        placeholder="Search by name or description"
      />
    </div>
    <div id="search_wrapper" class="search-results-panel"></div>

    <hr class="my-3" />

    <div class="d-flex row gap-2 justify-content-between m-3">
      <div class="flex-column col-md-6 col-12">
        <div class="flex-column p-3">
          <div class="d-flex row">
            <label class="col-5" for="Item" title="Item to craft">Item:</label>
            <select
              class="col-7"
              onchange="loadItem()"
              id="Item"
              title="Item to craft"
              style="width: 250px"
            ></select>
          </div>
          <div class="costrow d-flex row gap-1 mt-3">
            <span class="col-5" title="Market cost of the item being crafted"
              >Item Cost:</span
            >
            <div class="flex-column row col-7" style="padding-left: 0">
              <div class="d-flex gap-2">
                <input
                  class="col-5"
                  id="GP"
                  title="Market cost of the item being crafted, GP part"
                  value="120"
                  type="text"
                />
                <label
                  class="col-7"
                  for="GP"
                  title="Market cost of the item being crafted, GP part"
                  >GP</label
                >
              </div>
              <div class="d-flex gap-2">
                <input
                  class="col-5"
                  id="SP"
                  title="Market cost of the item being crafted, SP part"
                  value="0"
                  type="text"
                />
                <label
                  class="col-7"
                  for="SP"
                  title="Market cost of the item being crafted, SP part"
                  >SP</label
                >
              </div>
              <div class="d-flex gap-2">
                <input
                  class="col-5"
                  id="CP"
                  title="Market cost of the item being crafted, CP part"
                  value="0"
                  type="text"
                />
                <label
                  class="col-7"
                  for="CP"
                  title="Market cost of the item being crafted, CP part"
                  >CP</label
                >
              </div>
            </div>
          </div>
          <div class="d-flex row gap-1 mt-4">
            <label
              class="col-5"
              for="DC"
              title="Craft DC of the item being created"
              >Item DC:</label
            >
            <input
              class="col-3"
              id="DC"
              value="13"
              title="Craft DC of the item being created"
              type="text"
            />
          </div>
          <div class="d-flex row gap-1 mt-4">
            <label
              class="col-5"
              for="PriorWork"
              title="Work already done toward item creation"
              >Prior Work:</label
            >
            <input
              class="col-3"
              id="PriorWork"
              value="0"
              title="Work already done toward item creation"
              type="text"
            />
          </div>
          <div class="d-flex row gap-1 mt-4">
            <label
              class="col-5"
              for="Check"
              title="Craft (alchemy) skill check result"
              >Check Result:</label
            >
            <input
              class="col-3"
              id="Check"
              value="15"
              title="Craft (alchemy) skill check result"
              type="text"
            />
          </div>
          <input
            id="IsByDay"
            title="Calculate progress by day (instead of by week)"
            type="checkbox"
            hidden
          />
          <div class="d-flex row gap-1 mt-4">
            <label
              class="text-wrap col-5 d-flex"
              for="IsSwift"
              title="Character is Alchemist with Swift Alchemy (3rd level)"
              >Swift Alchemy (2x speed):</label
            >
            <div class="d-flex col-3 checkbox-input">
              <input
                id="IsSwift"
                title="Character is Alchemist with Swift Alchemy (3rd level)"
                type="checkbox"
              />
            </div>
          </div>
          <div class="d-flex row gap-1 mt-4">
            <label
              class="text-wrap col-5 d-flex"
              for="IsMaster"
              title="Character has the Master Alchemist feat"
              >Master Alchemist (10x speed):</label
            >
            <div class="d-flex col-3 checkbox-input">
              <input
                id="IsMaster"
                onchange="setItemCountState()"
                title="Character has the Master Alchemist feat"
                type="checkbox"
              />
            </div>
          </div>
          <div class="d-flex row gap-1 mt-4">
            <label
              class="col-5"
              for="ItemMultiple"
              title="Number of items to create in parallel (requires Master Alchemist)"
              >Item Count:</label
            >
            <input
              class="col-3"
              id="ItemMultiple"
              title="Number of items to create in parallel (requires Master Alchemist)"
              disabled="true"
              value="1"
              type="text"
            />
          </div>
          <div class="d-flex row gap-1 mt-4">
            <div class="col-5"></div>
            <input
              class="col-4"
              value="Recompute"
              onclick="recompute()"
              type="button"
            />
          </div>
        </div>
        <div class="result-wrapper p-3 mt-3">
          <div class="resultsrow d-flex row gap-3">
            <label
              class="col-4 text-wrap"
              for="Progress"
              title="Progress made toward item completion on this check"
              >Progress:</label
            >
            <input
              class="col-7"
              value=""
              title="Progress made toward item completion on this check"
              id="Progress"
              disabled="true"
              type="text"
            />
          </div>
          <div class="resultsrow d-flex row gap-3 mt-4">
            <label
              class="col-4 text-wrap"
              for="TotalProgress"
              title="Total progress made toward item completion"
              >Overall Progress:</label
            >
            <input
              class="col-7"
              value=""
              title="Total progress made toward item completion"
              id="TotalProgress"
              disabled="true"
              type="text"
            />
          </div>
          <div class="resultsrow d-flex row gap-3 mt-4">
            <label
              class="col-4 text-wrap"
              for="TimeTaken"
              title="Total amount of time taken to make this progress"
              >Time Taken:</label
            >
            <input
              class="col-7"
              value=""
              title="Total amount of time taken to make this progress"
              id="TimeTaken"
              disabled="true"
              type="text"
            />
          </div>
          <div class="resultsrow d-flex row gap-3 mt-4">
            <label
              class="col-4 text-wrap"
              for="AmountToPay"
              title="Amount to pay for this check (base materials only paid on first check)"
              >Amount To Pay:</label
            >
            <input
              class="col-7 col-md-8"
              title="Amount to pay for this check (base materials only paid on first check)"
              id="AmountToPay"
              disabled="true"
              type="text"
            />
          </div>
        </div>
      </div>

      <div class="itemdesc col-md-5">
        <div class="itemname" id="ItemName">
          <a
            href="http://www.d20pfsrd.com/gamemastering/afflictions/poison/arsenic"
            target="_blank"
          ></a>
        </div>
        <div class="description" id="Description">dsdsd</div>
      </div>
    </div>

    <div
      class="justify-content-center w-100 p-2"
      id="footer"
      style="
        display: none;
        position: fixed;
        bottom: 0px;
        height: 50px;
        background-color: #1e1e1e;
      "
      onclick="resetSearch()"
    >
      <button>Reset</button>
    </div>

    <script src="scripts/navbar.js?v=responsive-navbar-1"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="scripts/supabase-config.js"></script>
    <script src="scripts/app-supabase.js"></script>
    <script src="scripts/pages/craft-calculator.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script
      type="text/javascript"
      src="scripts/pages/craft-calculator-2.js?v=empty-search-2"
    ></script>
  </body>
</html>
