<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>PathFriends Dice Roller</title>
    <meta name="viewport" content="width=device-width, initial-scale=1" />

    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css"
      rel="stylesheet"
    />

    <link href="css/dice-roller.css" rel="stylesheet" />
  </head>

  <body>
    <div id="appNavbar"></div>

    <div class="container mt-3">
      <h3>Dice Roller</h3>

      <div class="row">
        <!-- LEFT -->
        <div class="col-lg-8">
          <!-- ATTACK -->
          <div class="section-title">Attack Rolls</div>

          <div class="row header-row">
            <div class="col-3">Die</div>
            <div class="col-3">Modifier</div>
            <div class="col-2">Crit</div>
            <div class="col-4">Actions</div>
          </div>

          <div id="attackContainer"></div>
          <button class="btn btn-primary btn-sm mb-3" onclick="addAttack()">
            Add Attack
          </button>

          <!-- DAMAGE -->
          <div class="section-title">Damage Rolls</div>

          <div class="row header-row damage-row">
            <div class="col-3 damage-dice-col">Count / Die</div>
            <div class="col-3 damage-mod-col">Modifier</div>
            <div class="col-2 damage-spacer-col"></div>
            <div class="col-4 damage-actions-col">Actions</div>
          </div>

          <div id="damageContainer"></div>
          <button class="btn btn-primary btn-sm" onclick="addDamage()">
            Add Damage
          </button>

          <div class="mt-3">
            <button class="btn btn-success btn-sm" onclick="rollAll()">
              Roll All
            </button>
          </div>
        </div>

        <!-- RIGHT -->
        <div class="col-lg-4 mt-3 mt-lg-0">
          <div class="result-box">
            <h5>Results</h5>
            <div id="results"></div>
            <hr />
            <strong>Total: <span id="total">0</span></strong>
          </div>
        </div>
      </div>
    </div>

    <script src="scripts/navbar.js?v=responsive-navbar-1"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="scripts/supabase-config.js"></script>
    <script src="scripts/app-supabase.js"></script>

    <script src="scripts/pages/dice-roller.js"></script>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  </body>
</html>
