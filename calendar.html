<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>PathFriends Calendar</title>
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta
      http-equiv="Cache-Control"
      content="no-cache, no-store, must-revalidate"
    />
    <meta http-equiv="Pragma" content="no-cache" />
    <meta http-equiv="Expires" content="0" />
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css"
      rel="stylesheet"
    />
    <link
      href="css/calendar.css?v=mobile-calendar-1"
      rel="stylesheet"
    />
    <link href="css/calendar-event-modal.css?v=1" rel="stylesheet" />
    <link
      href="css/calendar-holiday-details.css?v=local-holidays-1"
      rel="stylesheet"
    />
    <link
      href="css/calendar-day-modal.css?v=mobile-calendar-1"
      rel="stylesheet"
    />
    <link
      href="css/calendar-time-controls.css?v=mobile-calendar-1"
      rel="stylesheet"
    />
  </head>
  <body>
    <div id="appNavbar"></div>

    <main class="container-fluid mt-3 calendar-page">
      <div
        class="d-flex justify-content-between align-items-start gap-2 flex-wrap mb-3"
      >
        <div>
          <h3 class="mb-0">Calendar</h3>
          <div id="calendarCampaignLabel" class="small-text">
            Current campaign
          </div>
        </div>
        <div class="d-flex gap-2 flex-wrap justify-content-end">
          <button id="newCalendarEventBtn" class="btn btn-primary btn-sm" type="button">
            <i class="bi bi-plus-lg"></i> Event
          </button>
          <button
            id="openAssignDateModalBtn"
            class="btn btn-outline-info btn-sm calendar-mobile-action d-none"
            type="button"
          >
            Assign Date
          </button>
          <button
            id="openMoveDateModalBtn"
            class="btn btn-outline-info btn-sm calendar-mobile-action d-none"
            type="button"
          >
            Move Date
          </button>
          <button id="refreshCalendarBtn" class="btn btn-outline-light btn-sm" type="button">
            <i class="bi bi-arrow-clockwise"></i>
          </button>
        </div>
      </div>

      <div id="calendarStatus" class="alert d-none py-2"></div>

      <div class="calendar-layout">
        <aside class="calendar-sidebar">
          <section class="panel">
            <div class="calendar-current-date" id="campaignCurrentDate">-</div>
            <div class="calendar-current-time" id="campaignCurrentTime">--:--</div>
            <div class="small-text" id="campaignCurrentWeekday"></div>
          </section>

          <section id="calendarGmControls" class="panel calendar-gm-controls d-none">
            <div class="calendar-section-title">Assign Current Date</div>
            <div class="calendar-date-grid">
              <div>
                <label for="assignYear">Year</label>
                <input id="assignYear" class="form-control form-control-sm" type="number" min="1" />
              </div>
              <div>
                <label for="assignMonth">Month</label>
                <select id="assignMonth" class="form-select form-select-sm"></select>
              </div>
              <div>
                <label for="assignDay">Day</label>
                <input id="assignDay" class="form-control form-control-sm" type="number" min="1" />
              </div>
              <div>
                <label for="assignTime">Time</label>
                <input id="assignTime" class="form-control form-control-sm" type="time" step="1" />
              </div>
            </div>
            <button id="assignCurrentDateBtn" class="btn btn-outline-info btn-sm w-100 mt-2" type="button">
              Assign Current Date
            </button>

            <div class="calendar-section-title mt-3">Move Time By</div>
            <div class="calendar-move-grid">
              <input id="moveTimeAmount" class="form-control form-control-sm" type="number" min="1" value="1" />
              <select id="moveTimeUnit" class="form-select form-select-sm">
                <option value="turn">Turn</option>
                <option value="minute">Minute</option>
                <option value="hour">Hour</option>
                <option value="day">Day</option>
                <option value="week">Week</option>
                <option value="month">Month</option>
              </select>
              <button id="moveTimeBtn" class="btn btn-outline-info btn-sm" type="button">
                Move
              </button>
            </div>
          </section>

          <section id="selectedDayPanel" class="panel">
            <div class="calendar-section-title">Selected Day</div>
            <div id="selectedDaySummary" class="small-text mb-2"></div>
            <div id="selectedDayEvents" class="calendar-agenda"></div>
          </section>
        </aside>

        <section class="panel calendar-main">
          <div class="calendar-toolbar">
            <div class="btn-group btn-group-sm">
              <button id="previousMonthBtn" class="btn btn-outline-light" type="button">
                <i class="bi bi-chevron-left"></i>
              </button>
              <button id="goToCurrentMonthBtn" class="btn btn-outline-light" type="button">
                Today
              </button>
              <button id="nextMonthBtn" class="btn btn-outline-light" type="button">
                <i class="bi bi-chevron-right"></i>
              </button>
            </div>
            <h4 id="calendarMonthTitle" class="mb-0"></h4>
          </div>
          <div id="calendarWeekHeader" class="calendar-week-header"></div>
          <div id="calendarGrid" class="calendar-grid"></div>
        </section>
      </div>
    </main>

    <script src="scripts/navbar.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="scripts/supabase-config.js"></script>
    <script src="scripts/app-supabase.js?v=calendar-1"></script>
    <script src="scripts/calendar-data.js?v=local-holidays-1"></script>
    <script src="scripts/holiday-data.js?v=local-holidays-1"></script>
    <script src="scripts/calendar-event-modal.js?v=1"></script>
    <script src="scripts/calendar-holiday-details.js?v=local-holidays-1"></script>
    <script src="scripts/calendar-day-modal.js?v=mobile-calendar-1"></script>
    <script src="scripts/calendar-time-controls.js?v=mobile-calendar-1"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="scripts/pages/calendar.js?v=mobile-calendar-1"></script>
  </body>
</html>
