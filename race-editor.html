<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>PathFriends Race Editor</title>
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta
      http-equiv="Cache-Control"
      content="no-cache, no-store, must-revalidate"
    />
    <meta http-equiv="Pragma" content="no-cache" />
    <meta http-equiv="Expires" content="0" />
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css"
      rel="stylesheet"
    />
    <link href="css/race-editor.css?v=trait-duration-1" rel="stylesheet" />
    <link href="css/effect-editor.css?v=sla-requirements-1" rel="stylesheet" />
    <link href="modals/generated-equipment-picker.css?v=effect-labels-white-1" rel="stylesheet" />
    <link href="modals/magic-search.css" rel="stylesheet" />
    <link href="modals/custom-skill-list.css" rel="stylesheet" />
  </head>
  <body>
    <div id="appNavbar"></div>

    <main class="container-fluid mt-3">
      <div
        class="d-flex justify-content-between align-items-start gap-2 flex-wrap mb-3"
      >
        <div>
          <h3 class="mb-0">PathFriends Race Editor</h3>
          <div class="small-text">
            Local static-data editor for <code>data/races.json</code>.
          </div>
        </div>
        <div class="d-flex gap-2 flex-wrap justify-content-end">
          <button
            id="openProjectFolderBtn"
            class="btn btn-outline-info btn-sm"
            type="button"
          >
            <i class="bi bi-folder2-open"></i> Open Project Folder
          </button>
          <button
            id="exportSelectedRaceBtn"
            class="btn btn-outline-light btn-sm"
            type="button"
          >
            <i class="bi bi-filetype-json"></i> Export Selected Race
          </button>
          <button id="saveRacesFileBtn" class="btn btn-primary btn-sm" type="button">
            <i class="bi bi-save"></i> Save to Project
          </button>
        </div>
      </div>

      <div id="raceEditorStatus" class="alert d-none py-2"></div>

      <div class="editor-shell">
        <aside class="panel">
          <label for="raceSearch">Search Races</label>
          <input
            id="raceSearch"
            class="form-control form-control-sm mb-2"
            placeholder="Race name"
          />
          <label for="raceGroupFilter">Group</label>
          <select id="raceGroupFilter" class="form-select form-select-sm mb-2"></select>
          <div id="raceCount" class="small-text mb-2"></div>
          <div id="raceList" class="race-list"></div>
        </aside>

        <section id="raceEditorPanel" class="panel">
          <div class="small-text">Choose a race to edit.</div>
        </section>
      </div>
    </main>

    <script src="scripts/navbar.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="scripts/supabase-config.js"></script>
    <script src="scripts/app-supabase.js"></script>
    <script src="scripts/race-data.js?v=immunities-extra-1"></script>
    <script src="modals/effect-duration-editor.js"></script>
    <script src="scripts/effect-stat-options.js?v=skill-groups-1"></script>
    <script src="modals/effect-choice-picker.js?v=sequential-fix-1"></script>
    <script src="modals/magic-search.js"></script>
    <script src="modals/custom-skill-list.js?v=skill-groups-1"></script>
    <script src="scripts/effect-editor.js?v=sla-requirements-1"></script>
    <script src="modals/generated-equipment-picker.js?v=effect-labels-white-1"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="scripts/pages/race-editor.js?v=trait-duration-1"></script>
  </body>
</html>
