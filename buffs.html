<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>PathFriends Buff Tracker</title>
    <meta name="viewport" content="width=device-width, initial-scale=1" />

    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css"
      rel="stylesheet"
    />

    <link href="css/buffs.css" rel="stylesheet" />
  </head>

  <body>
    <!-- NAVBAR -->
    <div id="appNavbar"></div>

    <div class="container mt-3">
      <h3>PathFriends Buff Tracker</h3>

      <div class="d-flex flex-wrap gap-2 align-items-end mb-3">
        <div class="flex-grow-1">
          <label class="small" for="openBuffPickerSearch"
            >Search Buffs, Debuffs, Conditions</label
          >
          <input
            id="openBuffPickerSearch"
            class="form-control form-control-sm"
            placeholder="Search and add..."
            readonly
            data-bs-toggle="modal"
            data-bs-target="#buffPickerModal"
            onclick="openBuffPicker()"
          />
        </div>
        <button
          class="btn btn-outline-info btn-sm"
          type="button"
          data-bs-toggle="modal"
          data-bs-target="#customBuffModal"
          onclick="prepareCustomBuffModal()"
        >
          Custom Buff
        </button>
      </div>

      <div
        class="modal fade"
        id="buffPickerModal"
        tabindex="-1"
        aria-labelledby="buffPickerModalLabel"
        aria-hidden="true"
      >
        <div
          class="modal-dialog modal-xl modal-dialog-centered modal-dialog-scrollable search-modal-dialog"
        >
          <div class="modal-content">
            <div class="modal-header">
              <h5 class="modal-title" id="buffPickerModalLabel">Add Effect</h5>
              <button
                type="button"
                class="btn-close"
                data-bs-dismiss="modal"
                aria-label="Close"
              ></button>
            </div>
            <div class="modal-body">
              <div class="row g-2 mb-3">
                <div class="col-12">
                  <label class="small" for="buffPickerSearch">Search</label>
                  <input
                    id="buffPickerSearch"
                    class="form-control form-control-sm"
                    placeholder="Name, type, or stat change"
                  />
                </div>
              </div>
              <div
                id="buffPickerResults"
                class="buff-picker-grid search-modal-results"
              ></div>
            </div>
          </div>
        </div>
      </div>

      <div
        class="modal fade"
        id="customBuffModal"
        tabindex="-1"
        aria-labelledby="customBuffModalLabel"
        aria-hidden="true"
      >
        <div class="modal-dialog modal-lg modal-dialog-centered">
          <div id="customBuffPanel" class="modal-content">
            <div class="modal-header">
              <h5 class="modal-title" id="customBuffModalLabel">Custom Buff</h5>
              <button
                type="button"
                class="btn-close"
                data-bs-dismiss="modal"
                aria-label="Close"
              ></button>
            </div>
            <div class="modal-body">
              <div class="row g-2 mb-2">
                <div class="col-md-4">
                  <label class="small" for="customBuffName">Name</label>
                  <input
                    id="customBuffName"
                    class="form-control form-control-sm"
                    placeholder="Custom buff name"
                  />
                </div>
                <div class="col-md-4">
                  <label class="small" for="customBuffCategory">Category</label>
                  <select
                    id="customBuffCategory"
                    class="form-select form-select-sm"
                  >
                    <option value="Spell" selected>Spell</option>
                    <option value="Special Ability">Special Ability</option>
                    <option value="Feat">Feat</option>
                    <option value="Debuff">Debuff</option>
                    <option value="Condition">Condition</option>
                  </select>
                </div>
                <div class="col-md-4">
                  <label class="small" for="customBuffDuration">Duration</label>
                  <input
                    id="customBuffDuration"
                    class="form-control form-control-sm"
                    value="variable"
                  />
                </div>
                <div class="col-md-4">
                  <label class="small" for="customBuffContext"
                    >Context / Game</label
                  >
                  <input
                    id="customBuffContext"
                    class="form-control form-control-sm"
                    readonly
                  />
                </div>
              </div>

              <div class="small-text mb-1">Bonuses</div>
              <div id="customBonusRows" class="vstack gap-2 mb-2"></div>
              <div id="customBuffStatus" class="small-text mt-2"></div>
            </div>
            <div class="modal-footer">
              <button
                class="btn btn-outline-light btn-sm"
                type="button"
                onclick="addCustomBonusRow()"
              >
                Add Bonus
              </button>
              <button
                class="btn btn-primary btn-sm"
                type="button"
                onclick="saveCustomBuff()"
              >
                Save Custom Buff
              </button>
            </div>
          </div>
        </div>
      </div>

      <div class="form-check form-switch mb-3">
        <input
          id="statInfoToggle"
          class="form-check-input"
          type="checkbox"
          onchange="renderStats()"
        />
        <label class="form-check-label small" for="statInfoToggle"
          >Show stat calculations</label
        >
      </div>

      <div class="dice-row mb-3">
        <h5 class="mb-0">Character</h5>
        <div id="characterSummary" class="small-text"></div>
      </div>

      <h5>Active Buffs</h5>
      <div id="activeBuffs"></div>

      <h5 class="mt-4">Final Stats</h5>
      <div id="finalStats"></div>
    </div>

    <script src="scripts/navbar.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="scripts/supabase-config.js"></script>
    <script src="scripts/app-supabase.js"></script>
    <script src="scripts/buff-calculator.js?v=min-scale-1"></script>

    <script src="scripts/pages/buffs.js"></script>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  </body>
</html>
