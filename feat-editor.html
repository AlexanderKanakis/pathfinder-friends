<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>PathFriends Feat Editor</title>
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta
      http-equiv="Cache-Control"
      content="no-cache, no-store, must-revalidate"
    />
    <meta http-equiv="Pragma" content="no-cache" />
    <meta http-equiv="Expires" content="0" />
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css"
      rel="stylesheet"
    />
    <link href="css/feat-editor.css?v=1" rel="stylesheet" />
    <link href="css/effect-editor.css?v=sla-requirements-1" rel="stylesheet" />
    <link
      href="modals/generated-equipment-picker.css?v=effect-labels-white-1"
      rel="stylesheet"
    />
    <link href="modals/magic-search.css" rel="stylesheet" />
    <link href="modals/custom-skill-list.css" rel="stylesheet" />
  </head>
  <body>
    <div id="appNavbar"></div>

    <main class="container-fluid mt-3">
      <div
        class="d-flex justify-content-between align-items-start gap-2 flex-wrap mb-3"
      >
        <div>
          <h3 class="mb-0">PathFriends Feat Editor</h3>
          <div class="small-text">
            Local static-data editor for <code>data/feats.json</code>.
            Inferred effects are editable and can be corrected manually.
          </div>
        </div>
        <div class="d-flex gap-2 flex-wrap justify-content-end">
          <button
            id="openProjectFolderBtn"
            class="btn btn-outline-info btn-sm"
            type="button"
          >
            <i class="bi bi-folder2-open"></i> Open Project Folder
          </button>
          <button
            id="exportSelectedFeatBtn"
            class="btn btn-outline-light btn-sm"
            type="button"
          >
            <i class="bi bi-filetype-json"></i> Export Selected Feat
          </button>
          <button id="saveFeatsFileBtn" class="btn btn-primary btn-sm" type="button">
            <i class="bi bi-save"></i> Save to Project
          </button>
        </div>
      </div>

      <div id="featEditorStatus" class="alert d-none py-2"></div>

      <div class="editor-shell">
        <aside class="panel">
          <div class="d-flex justify-content-between align-items-end gap-2 mb-2">
            <div class="flex-grow-1">
              <label for="featSearch">Search Feats</label>
              <input
                id="featSearch"
                class="form-control form-control-sm"
                placeholder="Feat name"
              />
            </div>
            <button id="addFeatBtn" class="btn btn-outline-info btn-sm" type="button">
              <i class="bi bi-plus-lg"></i> Feat
            </button>
          </div>
          <label for="featTypeFilter">Type</label>
          <select id="featTypeFilter" class="form-select form-select-sm mb-2"></select>
          <div id="featCount" class="small-text mb-2"></div>
          <div id="featList" class="feat-list"></div>
        </aside>

        <section id="featEditorPanel" class="panel">
          <div class="small-text">Choose a feat to edit.</div>
        </section>
      </div>
    </main>

    <script src="scripts/navbar.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="scripts/supabase-config.js"></script>
    <script src="scripts/app-supabase.js"></script>
    <script src="scripts/feat-data.js?v=1"></script>
    <script src="modals/effect-duration-editor.js"></script>
    <script src="scripts/effect-stat-options.js?v=skill-groups-1"></script>
    <script src="modals/effect-choice-picker.js?v=sequential-fix-1"></script>
    <script src="modals/magic-search.js"></script>
    <script src="modals/custom-skill-list.js?v=skill-groups-1"></script>
    <script src="scripts/effect-editor.js?v=sla-requirements-1"></script>
    <script src="modals/generated-equipment-picker.js?v=effect-labels-white-1"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="scripts/pages/feat-editor.js?v=1"></script>
  </body>
</html>
